<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MENÚ DEL DÍA</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <!-- LOGIN -->
  <div id="loginOverlay">
    <div class="login-card">
      <h2>VER MENÚ</h2>

      <label>INGRESA USUARIO ADT</label>
      <input id="viewerUser" placeholder="">

      <button class="btn" onclick="loginViewer()">ENTRAR</button>

      <div id="loginErr"></div>

      <!-- CAJA DE SOLICITUD -->
      <div class="req-box" id="reqBox" style="display:none;">
        <div class="req-title">¿QUIERES ACCESO AL MENÚ DIGITAL?</div>
        <div class="req-sub">Si tu usuario no está registrado, puedes enviar una solicitud para que el admin lo apruebe.</div>
        <button class="btn req-btn" onclick="requestAccess()">ENVIAR SOLICITUD</button>
      </div>

      <div class="hint">* Acceso solo con usuario aprobado.</div>
    </div>
  </div>

  <!-- APP -->
  <div class="wrap">
    <div class="top">
      <div>
        <div class="brand">MENÚ DEL DÍA</div>
        <div class="who" id="whoTxt">NO LOGUEADO</div>
      </div>

      <!-- Acciones (tema con emoji + salir) -->
      <div class="actions">
        <button class="btn btn-theme" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Cambiar tema">
          <span class="icon" id="themeIcon">🌙</span>
          <span class="label" id="themeLabel">OSC.</span>
        </button>
        <button class="btn btn-logout" onclick="logoutViewer()">SALIR</button>
      </div>
    </div>

    <div class="grid" id="menusGrid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/index.js"></script>
</body>
</html>
