<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>SISTEMA ADT - ADMIN PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body id="mainBody">

  <!-- LOGIN -->
  <div id="loginOverlay">
    <div class="login-card">
      <h2 style="text-align: center; margin: 0 0 25px;">ADT ADMIN PRO</h2>
      <label>EMAIL</label><input id="lEmail" type="email">
      <label>PASSWORD</label><input id="lPass" type="password">
      <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 16px;" onclick="handleLogin()">ENTRAR</button>
      <p id="loginErr" style="color:red; font-size:10px; text-align:center; margin-top:15px; display:none; text-transform:none;"></p>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-brand"><h2>MENU GESTION</h2></div>
    <div class="nav-group-title">GESTIÓN MENÚS</div>
    <div class="sidebar-nav">
      <button class="nav-btn active" id="navB" onclick="switchView('builder')">🛠 INGRESO MENÚS</button>
      <button class="nav-btn" id="navH" onclick="switchView('history')">📜 HISTORIAL</button>
    </div>
    <div id="pickerSection" class="catalog-scroll">
        <div class="nav-group-title" style="padding-left: 5px;">SELECCIÓN RÁPIDA</div>
        <input type="text" id="catSearch" placeholder="🔍 BUSCAR..." oninput="filterCatalog()" style="width:100%; background:#1e293b; border:none; color:white; padding:10px; border-radius:8px; margin-bottom:10px; font-size:10px; text-transform: none;">
        <div id="catalogList"></div>
    </div>
    <div class="admin-bottom">
      <div class="nav-group-title">ADMINISTRADOR</div>
      <div class="sidebar-nav">
        <button class="nav-btn hidden" id="navC" onclick="switchView('catalog')">📂 ALIMENTOS</button>
        <button class="nav-btn hidden" id="navU" onclick="switchView('users')">👥 USUARIOS</button>
      </div>
    </div>
  </aside>

  <main class="main-area">
    <header class="top-bar">
      <div style="display: flex; align-items: center; gap: 15px;">
        <button class="btn-toggle" onclick="document.getElementById('mainBody').classList.toggle('sidebar-hidden')"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        <h1 id="viewTitle" style="font-size: 14px; margin: 0; font-weight: 800; color: var(--muted);">🛠 INGRESO MENÚS</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 15px;">
        <div id="statsBadge" style="font-size:10px; font-weight:900; color:var(--accent); background:white; padding:5px 12px; border-radius:8px; border:1px solid var(--border);">VISITAS: <span id="vCount">0</span></div>
        <span id="userBadge" style="font-size: 9px; font-weight: 800; color: var(--accent); text-transform: lowercase;"></span>
        <button onclick="handleLogout()" class="btn" style="background:#e2e8f0; font-size: 10px;">SALIR</button>
      </div>
    </header>

    <div class="view-port" id="appMain">
      <div class="container">
        
        <!-- VISTA USUARIOS MEJORADA -->
        <div id="viewUsers" class="hidden">
            <!-- PARTE 1: ADMINISTRADORES -->
            <div class="card" style="border-top: 4px solid var(--accent);">
                <h3 id="adminFormTitle" style="margin-top:0; font-size:13px; color: var(--accent);">🛡️ GESTIÓN DE ADMINISTRADORES (CON CONTRASEÑA)</h3>
                <div class="grid-form">
                    <input type="hidden" id="editAdminId">
                    <div><label>EMAIL ADMIN</label><input id="aEmail" type="email" style="text-transform: none !important;"></div>
                    <div><label id="aPassLabel">PASSWORD</label><input id="aPass" type="password" style="text-transform: none !important;"></div>
                    <div style="grid-column: 1 / -1; display:flex; gap:15px; align-items:center;">
                        <label style="margin:0; cursor:pointer;"><input type="checkbox" id="apCat"> ADM. CATÁLOGO</label>
                        <label style="margin:0; cursor:pointer;"><input type="checkbox" id="apUsr"> ADM. USUARIOS</label>
                        <button class="btn btn-primary" onclick="saveAdmin()" style="margin-left:auto;">GUARDAR ADMIN</button>
                    </div>
                </div>
            </div>

            <!-- PARTE 2: VISORES INDEX -->
            <div class="card" style="border-top: 4px solid var(--success);">
                <h3 id="viewerFormTitle" style="margin-top:0; font-size:13px; color: var(--success);">👁️ ACCESO AL INDEX (SOLO USUARIO / SIN PASSWORD)</h3>
                <div class="grid-form">
                    <input type="hidden" id="editViewerId">
                    <div><label>USUARIO / EMAIL</label><input id="vEmail" type="text" placeholder="NOMBRE DE USUARIO" style="text-transform: none !important;"></div>
                    <div style="display:flex; align-items:flex-end; gap:10px;">
                        <button class="btn btn-ghost hidden" id="btnCancelViewer" onclick="resetViewerForm()">✕</button>
                        <button class="btn btn-success" onclick="saveViewer()" style="width:100%;">HABILITAR ACCESO INDEX</button>
                    </div>
                </div>
            </div>

            <!-- TABLA DE HISTORIAL DE USUARIOS -->
            <div class="table-wrap">
                <table>
                    <thead><tr><th>USUARIO / EMAIL</th><th>ATRIBUTOS ACTIVOS</th><th style="text-align:right;">ACCIONES</th></tr></thead>
                    <tbody id="usrTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- CONSTRUCTOR, CATALOGO, HISTORIAL (CARGA DINÁMICA IGUAL) -->
        <div id="viewBuilder"><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;"><div><label>FECHA</label><input id="menuDate" type="date"></div><div><label>IDENTIFICADOR</label><div id="autoName" style="font-size:20px;font-weight:900;color:var(--accent);margin-top:8px;">MENÚ DEL DÍA</div></div></div><button id="btnPublish" class="btn btn-primary" style="width:100%;margin-top:20px;padding:18px;" onclick="saveMenu()">PUBLICA MENÚ</button><div id="draftList" style="margin-top:25px;"></div><div id="emptyMsg" style="text-align:center;color:var(--muted);padding:30px;">BORRADOR VACÍO</div></div></div>
        <div id="viewHistory" class="hidden"><div style="display:flex;justify-content:flex-end;margin-bottom:15px;"><button class="btn btn-danger" onclick="delAllMenus()">🗑️ BORRAR HISTORIAL</button></div><div class="card"><table><tbody id="historyTable"></tbody></table></div></div>
        <div id="viewCatalog" class="hidden"><div class="card" style="border-top:4px solid var(--accent);"><h3 id="catFormTitle" style="margin-top:0;font-size:13px;color:var(--accent);">CATÁLOGO</h3><div class="grid-form"><input type="hidden" id="editCatId"><div><label>CAT.</label><input id="cCat"></div><div><label>ACOMP.</label><input id="cAcomp"></div><div><label>OPCIÓN 1</label><input id="cO1"></div><div><label>OPCIÓN 2</label><input id="cO2"></div><div><label>OPCIÓN 3</label><input id="cO3"></div><div><label>OPCIÓN 4</label><input id="cO4"></div><div style="display:flex;justify-content:flex-end;gap:5px;grid-column:1/-1;"><button class="btn btn-ghost hidden" id="btnCancelCat" onclick="resetCatForm()">✕</button><button class="btn btn-primary" onclick="saveFood()">GUARDAR</button></div></div></div><div class="table-wrap"><table><tbody id="catTable"></tbody></table></div></div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
</body>
</html>
